<html lang="ar" dir="rtl">
  <head>

    <meta

    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tamam" />

    <title>Tamam - تمام</title>
    <meta
      name="description"
      content="Tamam App - Your ultimate delivery solution. Fast, secure, and reliable delivery for food, groceries, and packages."
    />
    <meta
      name="keywords"
      content="delivery app, food delivery, grocery delivery, Tamam app, fast delivery"
    />
    <meta name="author" content="Tamam App" />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="Tamam - تمام" />
    <meta
      property="og:description"
      content="Experience lightning-fast delivery with Tamam App."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social/og-image.jpg" />
    <meta property="og:url" content="https://tamaam.cloud" />
    <meta property="og:site_name" content="Tamam App" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tamaamApp" />
    <meta name="twitter:title" content="Tamam - تمام" />
    <meta
      name="twitter:description"
      content="Experience lightning-fast delivery with Tamam App."
    />
    <meta name="twitter:image" content="/social/twitter-image.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/svg/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icons/apple-touch-icon-180x180.png"
    />
    <link rel="mask-icon" href="/svg/safari-pinned-tab.svg" color="#22c55e" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const isDark = savedTheme === "dark" || (!savedTheme && systemDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
        try {
          const savedLang = localStorage.getItem("i18nextLng");
          if (savedLang === "ar") {
            document.documentElement.setAttribute("dir", "rtl");
            document.documentElement.setAttribute("lang", "ar");
          }
        } catch (e) {}
      })();
    </script>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #18181b;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      .dark body,
      body.dark {
        background: #0a0a0a;
        color: #ffffff;
      }

      body.loading {
        overflow: hidden;
      }

      body.loading #root {
        opacity: 0;
      }

      body.loaded #root {
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #f0fdf4 0%,
          #dcfce7 50%,
          #ffffff 100%
        );
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
        opacity: 1;
        visibility: visible;
      }

      .dark .loading-screen {
        background: linear-gradient(
          135deg,
          #052e16 0%,
          #0a0a0a 50%,
          #0a0a0a 100%
        );
      }

      body.loaded .loading-screen {
        opacity: 0;
        visibility: hidden;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        position: relative;
        animation: logoFloat 2s ease-in-out infinite;
      }

      .loading-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* filter: drop-shadow(0 10px 12px rgba(2, 44, 34, 0.25)); */
      }

      .loading-text {
        margin-top: 24px;
        font-size: 18px;
        font-weight: 700;
        color: #064e3b;
        letter-spacing: -0.02em;
        text-align: center;
        animation: textPulse 2s ease-in-out infinite;
      }

      .dark .loading-text {
        color: #4ade80;
      }

      .loading-bar {
        width: 120px;
        height: 4px;
        margin-top: 20px;
        border-radius: 4px;
        background: rgba(34, 197, 94, 0.15);
        overflow: hidden;
        position: relative;
      }

      .dark .loading-bar {
        background: rgba(34, 197, 94, 0.1);
      }

      .loading-bar-fill {
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          #22c55e 0%,
          #15803d 50%,
          #064e3b 100%
        );
        box-shadow:
          0 0 12px rgba(34, 197, 94, 0.4),
          0 0 24px rgba(34, 197, 94, 0.2);
        animation: barFill 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .loading-dots {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .dark .loading-dot {
        background: #4ade80;
      }

      .loading-dot:nth-child(1) {
        animation-delay: 0s;
      }

      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.02);
        }
      }

      @keyframes logoGlow {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
      }

      @keyframes barFill {
        0% {
          width: 0;
        }
        60% {
          width: 80%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes textPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @keyframes dotBounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1.3);
          opacity: 1;
        }
      }

      @media (max-width: 640px) {
        .loading-logo {
          width: 64px;
          height: 64px;
        }
        .loading-text {
          font-size: 16px;
        }
        .loading-bar {
          width: 100px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-logo,
        .loading-logo::after,
        .loading-text {
          animation: none;
        }
        .loading-bar-fill {
          animation: none;
          width: 100%;
        }
        .loading-dot {
          animation: none;
          opacity: 1;
          transform: scale(1);
        }
      }

      @media print {
        .loading-screen {
          display: none;
        }
        body {
          background: #fff;
          color: #000;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div class="loading-screen">
      <div class="loading-logo">
        <img src="/svg/favicon.svg" alt="Tamam logo" />
      </div>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
      <!-- <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div> -->
    </div>

    <div id="root"></div>

    <script>
      (function () {
        if (document.body) document.body.classList.add("loading");
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (document.body) {
              document.body.classList.remove("loading");
              document.body.classList.add("loaded");
            }
          }, 600);
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
