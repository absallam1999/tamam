<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 160 160">
  <defs>
    <!-- Premium Dark Background Gradient (iOS Style) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1528" />
      <stop offset="50%" stop-color="#0D0A14" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Primary Purple Gradient (Left Arm & Stem of 'T') -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Accent Pink/Rose Gradient (The Checkmark) -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Drop Shadow for the 3D Ribbon Overlap -->
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. APP ICON BACKGROUND -->
  <!-- ========================================== -->
  <g id="app-icon-base">
    <!-- Main Dark Squircle -->
    <rect width="160" height="160" rx="36" fill="url(#bgGrad)" />
    <!-- Glassmorphism Inner Border Reflection -->
    <rect width="156" height="156" x="2" y="2" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  </g>

  <!-- ========================================== -->
  <!-- 2. TAMAM LOGO MARK -->
  <!-- ========================================== -->
  <g id="tamam-mark">
    <!-- Ambient Background Glow -->
    <g filter="url(#glowBlur)" opacity="0.4">
      <path d="M 40 50 L 80 50 L 80 110 L 120 50" fill="none" stroke="#A855F7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Back Ribbon: The 'T' Left Crossbar and Vertical Stem -->
    <path 
      d="M 40 50 L 80 50 L 80 110" 
      fill="none" 
      stroke="url(#primaryGradient)" 
      stroke-width="24" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Front Ribbon: The Checkmark Swoosh -->
    <path 
      d="M 80 110 L 120 50" 
      fill="none" 
      stroke="url(#accentGradient)" 
      stroke-width="24" 
      stroke-linecap="round" 
      filter="url(#ribbonShadow)" 
    />
  </g>
</svg>